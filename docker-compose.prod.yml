services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      PAN_HMAC_SECRET: ${PAN_HMAC_SECRET}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      PORT: 4000
      MAILBOX_ENABLED: ${MAILBOX_ENABLED:-false}
      APP_BASE_URL: ${APP_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MAIL_CREDENTIAL_ENC_KEYS: ${MAIL_CREDENTIAL_ENC_KEYS:-}
      MAIL_CREDENTIAL_ENC_ACTIVE_VERSION: ${MAIL_CREDENTIAL_ENC_ACTIVE_VERSION:-1}
      EMAIL_HMAC_SECRET: ${EMAIL_HMAC_SECRET:-}
      MAIL_SYNC_CRON: ${MAIL_SYNC_CRON:-0 */6 * * *}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_prod:
